name: landing-ci

on:
  workflow_dispatch:

  pull_request:
    paths:
      - ".github/workflows/landing-ci.yml"
      - "README.md"
      - "assets/**"
      - "apps/landing/**"
      - "packages/content-landing/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "!apps/landing/**/*.md"
      - "!packages/content-landing/**/*.md"
      
  push:
    paths:
      - ".github/workflows/landing-ci.yml"
      - "README.md"
      - "assets/**"
      - "apps/landing/**"
      - "packages/content-landing/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "!apps/landing/**/*.md"
      - "!packages/content-landing/**/*.md"
      
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @valentines/landing...
      - name: Lint content-landing
        run: pnpm --filter @valentines/content-landing lint
      - name: Test content-landing
        run: pnpm --filter @valentines/content-landing test
      - name: Typecheck content-landing
        run: pnpm --filter @valentines/content-landing typecheck
      - name: Lint landing app
        run: pnpm --filter @valentines/landing lint
      - name: Test landing app
        run: pnpm --filter @valentines/landing test
      - name: Typecheck landing app
        run: pnpm --filter @valentines/landing typecheck
      - name: Build landing app
        run: pnpm --filter @valentines/landing build

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy landing to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl "$deploy_url"
